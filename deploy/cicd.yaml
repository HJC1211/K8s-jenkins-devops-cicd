---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: k8s-cicd
    component: devops1
    tier: backend1
  name: k8s-cicd
  namespace: kube-devops
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app: k8s-cicd
      component: devops1
      tier: backend1
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: k8s-cicd
        component: devops1
        tier: backend1
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: k8s-cicd
          image: REGISTRY/DOCKERHUB_NAMESPACE/APP_NAME:TAG_NAME
          readinessProbe:
            httpGet:
              path: /users
              port: 8080
            timeoutSeconds: 10
            failureThreshold: 30
            periodSeconds: 5
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 300m
              memory: 600Mi
            requests:
              cpu: 100m
              memory: 100Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: k8s-cicd
    component: devops1
  name: k8s-cicd-demo1
  namespace: kube-devops
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: k8s-cicd
    component: devops1
    tier: backend1
  sessionAffinity: None
  type: NodePort
